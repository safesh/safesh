version: 2

project_name: safesh

before:
  hooks:
    - go mod tidy

builds:
  - id: safesh
    main: ./cmd/safesh
    binary: safesh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: safesh
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: safesh
    name: safesh
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

snapshot:
  version_template: "{{ .Tag }}-next"

brews:
  - name: safesh
    repository:
      owner: safesh
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: safesh-releaser
      email: releases@safesh.sh
    commit_msg_template: "safesh {{ .Tag }}"
    homepage: "https://safesh.sh"
    description: "Drop-in safer replacement for bash in curl|bash flows."
    license: "MIT"
    skip_upload: auto
    test: |
      system "#{bin}/safesh", "version"
    install: |
      bin.install "safesh"
